<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arknights Shared Viewer</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <h1>Arknights Shared Viewer</h1>
            <div class="header-actions">
                <div class="language-selector">
                    <label><input type="radio" name="language" value="ja" checked> 日本語</label>
                    <label><input type="radio" name="language" value="en"> English</label>
                    <label><input type="radio" name="language" value="ch"> 中文</label>
                </div>
                <div class="share-buttons">
                    <button id="copy-url-button">URLをコピー</button>
                    <button id="tweet-button">Xでポスト</button>
                </div>
            </div>
        </header>

        <main>
            <section id="filter-toolbar" class="filter-toolbar" hidden aria-label="Operator filters">
                <button id="open-filter-button" type="button">フィルター</button>
                <div id="applied-filter-chips" class="applied-filter-chips"></div>
                <output id="filter-result-count" aria-live="polite"></output>
            </section>

            <dialog id="operator-filter-dialog" class="filter-dialog" aria-labelledby="filter-dialog-title">
                <form id="filter-form" method="dialog">
                    <header class="filter-dialog-header">
                        <h2 id="filter-dialog-title">オペレーターフィルター</h2>
                        <button id="filter-close-button" type="button">閉じる</button>
                    </header>
                    <div class="filter-dialog-body filter-area">
                        <nav id="filter-category-list" class="filter-category-list" aria-label="Filter categories"></nav>
                        <section id="filter-editor" class="filter-editor"></section>
                        <aside class="filter-draft-summary">
                            <div id="draft-filter-cards" class="filter-condition-cards"></div>
                        </aside>
                    </div>
                    <footer class="filter-dialog-footer">
                        <button id="filter-clear-button" type="button">すべて解除</button>
                        <output id="filter-preview-count" aria-live="polite"></output>
                        <button id="filter-cancel-button" type="button">キャンセル</button>
                        <button id="filter-apply-button" type="submit">適用</button>
                    </footer>
                </form>
            </dialog>

            <!-- テーブル表示エリア -->
            <div class="table-container">
                <table id="operators-table">
                    <thead>
                        <tr id="operators-head-row">
                            <th>Code</th>
                            <th>OperatorName</th>
                            <th>Potential</th>
                            <th>Elite</th>
                            <th>Level</th>
                            <th>Skill</th>
                            <th>S1 Mastery</th>
                            <th>S2 Mastery</th>
                            <th>S3 Mastery</th>
                        </tr>
                    </thead>
                    <tbody id="operators-body">
                        <!-- JavaScriptで動的に生成 -->
                    </tbody>
                </table>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 Arknights Viewer</p>
        </footer>
    </div>

    <!-- アプリケーションスクリプト -->
    <script src="scripts/masterData.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
