<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arknights Shared Viewer</title>
    <link rel="icon" href="appicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <h1>Arknights Shared Viewer</h1>
            <div class="header-actions">
                <div class="share-buttons">
                    <button id="copy-url-button">URLをコピー</button>
                    <button id="tweet-button">Xでポスト</button>
                </div>
                <button id="open-config-button" class="config-button" type="button">Config</button>
            </div>
        </header>

        <dialog id="config-dialog" class="config-dialog" aria-labelledby="config-dialog-title">
            <form method="dialog">
                <header class="config-dialog-header">
                    <h2 id="config-dialog-title">設定</h2>
                    <button id="config-close-button" type="submit">閉じる</button>
                </header>
                <fieldset class="language-selector">
                    <legend id="language-selector-title">表示言語</legend>
                    <label><input type="radio" name="language" value="ja" checked> 日本語</label>
                    <label><input type="radio" name="language" value="en"> English</label>
                    <label><input type="radio" name="language" value="ch"> 中文</label>
                </fieldset>
                <fieldset class="operator-display-selector">
                    <legend id="operator-display-title">表示対象</legend>
                    <label>
                        <input id="include-china-ahead" type="checkbox">
                        <span id="include-china-ahead-label">大陸版先行オペレーターを表示</span>
                    </label>
                </fieldset>
            </form>
        </dialog>

        <main>
            <section id="filter-toolbar" class="filter-toolbar" hidden aria-label="Operator filters">
                <button id="open-filter-button" type="button">フィルター</button>
                <div id="applied-filter-chips" class="applied-filter-chips"></div>
                <output id="filter-result-count" aria-live="polite"></output>
            </section>

            <dialog id="operator-filter-dialog" class="filter-dialog" aria-labelledby="filter-dialog-title">
                <form id="filter-form" method="dialog">
                    <header class="filter-dialog-header">
                        <h2 id="filter-dialog-title">オペレーターフィルター</h2>
                        <button id="filter-close-button" type="button">閉じる</button>
                    </header>
                    <div class="filter-dialog-body filter-area">
                        <nav id="filter-category-list" class="filter-category-list" aria-label="Filter categories"></nav>
                        <section id="filter-editor" class="filter-editor"></section>
                        <aside class="filter-draft-summary">
                            <div id="draft-filter-cards" class="filter-condition-cards"></div>
                        </aside>
                    </div>
                    <footer class="filter-dialog-footer">
                        <button id="filter-clear-button" type="button">すべて解除</button>
                        <output id="filter-preview-count" aria-live="polite"></output>
                        <button id="filter-cancel-button" type="button">キャンセル</button>
                        <button id="filter-apply-button" type="submit">適用</button>
                    </footer>
                </form>
            </dialog>

            <!-- テーブル表示エリア -->
            <div class="table-container">
                <table id="operators-table">
                    <thead>
                        <tr id="operators-head-row">
                            <th rowspan="2" data-column-key="code" data-sort-key="code">Code</th>
                            <th rowspan="2" data-column-key="name" data-sort-key="name">オペレーター</th>
                            <th rowspan="2" data-column-key="potential" data-sort-key="potential">潜在</th>
                            <th rowspan="2" data-column-key="elite" data-sort-key="elite">昇進</th>
                            <th rowspan="2" data-column-key="level" data-sort-key="level">レベル</th>
                            <th rowspan="2" data-column-key="skill" data-sort-key="skill">スキル</th>
                            <th colspan="3" class="column-group-start" data-column-group="mastery">特化</th>
                            <th class="column-group-start" data-column-group="module">モジュール</th>
                        </tr>
                        <tr id="operators-subhead-row">
                            <th class="column-group-start" data-column-key="skill1" data-sort-key="skill1">S1</th>
                            <th data-column-key="skill2" data-sort-key="skill2">S2</th>
                            <th data-column-key="skill3" data-sort-key="skill3">S3</th>
                        </tr>
                    </thead>
                    <tbody id="operators-body">
                        <!-- JavaScriptで動的に生成 -->
                    </tbody>
                </table>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 Arknights Viewer</p>
        </footer>
    </div>

    <!-- アプリケーションスクリプト -->
    <script src="scripts/masterData.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
